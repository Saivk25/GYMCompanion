# Local development only. No orchestration platform (Kubernetes etc.) — a
# single small deployment target is enough at this project's scale; see the
# Engineering Master Plan's "what we are deliberately not building yet"
# table (Section 1).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymcompanion
      POSTGRES_PASSWORD: gymcompanion
      POSTGRES_DB: gymcompanion
    ports:
      - "5433:5432" # host 5433 -> container 5432 — host 5432 is already used by another project
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymcompanion -d gymcompanion"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # Migrations are not run automatically on container start (see
    # infra/README.md) — run `docker compose exec backend alembic upgrade
    # head` explicitly after the stack is up. Auto-migrating on every boot
    # is easy to get wrong with more than one replica; a solo developer
    # with one backend instance doesn't need that risk for the convenience.
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GYM_ENVIRONMENT: local
      GYM_DATABASE_URL: postgresql+psycopg://gymcompanion:gymcompanion@postgres:5432/gymcompanion
      GYM_SECRET_KEY: change-me-in-every-real-environment
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

name: gym_companion_mobile
description: >
  Gym Companion client — a fitness companion with a deterministic, rule-based coaching
  layer (not AI/ML — see repository README's "What this is" section). Five-tab shell
  (Today, Train, Fuel, Progress, Coach) per the UX/UI Design Bible.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Routing: chosen in the Engineering Master Plan (Section 3.6, "the go_router
  # route table") — StatefulShellRoute gives each bottom-tab its own navigation
  # stack, which the UX/UI Design Bible's back-behavior rules (Section 4) assume.
  go_router: ^14.2.0

  # State management: not pinned by any of the six frozen documents. Chosen here
  # (see docs/adr/0003-state-management.md) over alternatives for testability
  # without a code generator this environment can't run to verify.
  flutter_riverpod: ^2.5.1

  # HTTP client for the real (non-mock) repositories — see
  # docs/adr/0042-production-integration-plan.md Part 2 and
  # lib/core/network/api_client.dart. Chosen over the lower-level `http`
  # package for its built-in interceptor chain, which is what
  # lib/core/network/interceptors/ builds the bearer-token-injection,
  # retry, and debug-logging behavior on top of without hand-rolling
  # request/response middleware.
  dio: ^5.11.1

  # Secure storage for the refresh token (`lib/features/auth/
  # infrastructure/secure_token_storage.dart`) — Keychain on iOS,
  # EncryptedSharedPreferences/Keystore-backed on Android. The access
  # token is deliberately never written here (or anywhere on disk) — see
  # that file's own doc comment for why only the refresh token persists.
  flutter_secure_storage: ^9.2.2

  # Local read-through cache for offline reads (`lib/core/cache/`) — see
  # docs/adr/0052-offline-caching.md for the trade-off record against
  # Hive/Drift/sqflite. Chosen for this app's actual cache shape: a
  # handful of small JSON view-state blobs, read/written by key, with no
  # querying or relational needs — the plain, official, zero-codegen
  # key-value store this shape calls for, not the encrypted secret store
  # `flutter_secure_storage` above already covers for the one real
  # secret this app persists.
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# Gym Companion — Continuous Integration.
#
# CI only: this workflow verifies the repository is correct and buildable.
# It does not deploy anything anywhere — see the Engineering Master Plan's
# Section 10 (release process is manual, direct-to-device, during MVP
# through Beta) and Section 1's over-engineering table.
#
# Design notes (kept here rather than in a separate doc, so the reasoning
# travels with the file it explains):
#
# - No Python-version or OS matrix. This project has exactly one deployment
#   target (python:3.12-slim, backend/Dockerfile) and one developer. A
#   matrix exists to catch compatibility problems across environments you
#   actually ship to or support; testing against Python versions this
#   project will never run on on a runner OS it will never deploy to is
#   pure CI-minutes cost for a signal nobody would act on — the same
#   "not yet, until it's justified" reasoning the Engineering Master Plan
#   applies everywhere else (Section 1). Revisit if a second maintainer or
#   a second deployment target ever appears.
# - Independent jobs, not one long sequential job. backend-quality (lint /
#   format / typecheck / static migration-content check) needs no service
#   containers and finishes in well under a minute; backend-test, docker-
#   build, and mobile all take longer and need real infrastructure spun up.
#   Running them in parallel means a trivial lint mistake reports failed
#   in seconds without waiting on Postgres or a Flutter SDK download — this
#   *is* this workflow's fast-failure strategy, not a separate feature.
# - Every job installs from backend/requirements-lock.txt (hash-pinned,
#   generated by `make backend-lock`), not pyproject.toml's ranges
#   directly. That's what makes a CI run reproducible: the exact same
#   dependency versions today as six months from now, until someone
#   deliberately regenerates the lock file and reviews the diff.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same branch/PR instead of burning minutes
# on a push that's already been overtaken by a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12" # matches backend/Dockerfile's python:3.12-slim base

jobs:
  # --- Fast, no external services. This is what "fast failure" buys you. ---
  backend-quality:
    name: Backend / lint, format, typecheck, migration content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install (reproducible, hash-pinned)
        run: |
          pip install -r backend/requirements-lock.txt
          pip install --no-deps ./backend

      - name: Ruff lint
        run: cd backend && python -m ruff check .

      - name: Ruff format check
        run: cd backend && python -m ruff format --check .

      - name: mypy (strict)
        run: cd backend && PYTHONPATH=. python -m mypy app tests

      - name: Destructive-migration content check
        run: python scripts/check_destructive_migrations.py

  # --- Needs a real database: migration application + full test suite. ---
  backend-test:
    name: Backend / migrations + pytest (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches infra/docker-compose.yml's Postgres exactly, so "works
        # in CI" and "works via docker compose locally" mean the same
        # thing.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymcompanion
          POSTGRES_PASSWORD: gymcompanion
          POSTGRES_DB: gymcompanion
        ports:
          - 5432:5432
        # GitHub Actions blocks every later step until this reports
        # healthy — no manual "wait for Postgres" polling needed.
        options: >-
          --health-cmd "pg_isready -U gymcompanion -d gymcompanion"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # GYM_ENVIRONMENT is intentionally left at its default ("local"):
      # this is a throwaway, ephemeral database that lives for exactly
      # this job, not a real environment — see "secrets" note below.
      GYM_DATABASE_URL: postgresql+psycopg://gymcompanion:gymcompanion@localhost:5432/gymcompanion
      GYM_TEST_DATABASE_URL: postgresql+psycopg://gymcompanion:gymcompanion@localhost:5432/gymcompanion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install (reproducible, hash-pinned)
        run: |
          pip install -r backend/requirements-lock.txt
          pip install --no-deps ./backend

      - name: Alembic — migration verification (upgrade head, fresh database)
        run: cd backend && PYTHONPATH=. python -m alembic upgrade head

      - name: Alembic — migration drift detection
        run: cd backend && PYTHONPATH=. python -m alembic check

      - name: pytest (unit + integration — a real Postgres is available here)
        run: cd backend && PYTHONPATH=. python -m pytest -v

  # --- Dockerfile validation, without the full compose-stack smoke test
  #     that docs/adr/0004-docker-verification-constraint.md explicitly
  #     scopes out of Step 11 (it needs a live Postgres reachable from
  #     inside the container network, i.e. docker compose, which is a
  #     later, separate addition). This proves the image builds and that
  #     everything it needs (app/, alembic/, alembic.ini) actually made it
  #     into the image — exactly the class of bug Step 10 found and fixed
  #     (the Dockerfile not yet copying alembic/). ---
  docker-build:
    name: Docker / build + import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: gym-companion-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Import smoke test (no database, no network required)
        run: |
          docker run --rm gym-companion-backend:ci python -c "
          from app.infra import models
          from app.infra.orm_base import Base
          assert 'users' in Base.metadata.tables, 'users table missing from ORM metadata'
          from alembic.config import Config
          cfg = Config('alembic.ini')
          assert cfg.get_main_option('script_location'), 'alembic.ini not readable in image'
          print('image contents OK: app package, alembic config, and ORM metadata all present')
          "

  # --- Real verification of the Flutter scaffold, as promised in
  #     docs/adr/0002-flutter-verification-constraint.md: "Real
  #     verification ... happens in two places: the CI workflow added in
  #     Step 11 ... and on Sai's own machine." This is that promise kept. ---
  mobile:
    name: Mobile / flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # "stable" rather than a pinned exact version: pubspec.yaml
          # already constrains the SDK floor (environment.flutter
          # >=3.24.0); tracking stable keeps CI matching what a new
          # contributor gets from `flutter --version` on a fresh install,
          # without a second version number to remember to bump.
          channel: stable
          cache: true

      - name: flutter pub get
        run: cd apps/mobile && flutter pub get

      - name: flutter analyze
        run: cd apps/mobile && flutter analyze

      - name: flutter test
        run: cd apps/mobile && flutter test

# --- Secrets ---
# No secrets are used in this workflow, and none are needed yet. Every
# value above (the Postgres credentials, GYM_DATABASE_URL) is the same
# fixed local-development-only value already committed in
# infra/docker-compose.yml and backend/.env.example — not sensitive,
# because app/core/config.py's Settings validator refuses to boot with
# the placeholder GYM_SECRET_KEY outside GYM_ENVIRONMENT=local/test, and
# this job never sets GYM_ENVIRONMENT to anything else. When a real secret
# is introduced (a Sentry DSN, an AI provider API key — Sprint 2 onward),
# it must be added via the repository's Settings -> Secrets and variables
# -> Actions, referenced as ${{ secrets.NAME }}, and never hardcoded into
# this file or logged. Nothing here should ever need write access to
# anything outside this workflow run.

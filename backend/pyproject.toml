[project]
name = "gym-companion-backend"
version = "0.1.0"
description = "Gym Companion backend: FastAPI API layer over a framework-free domain core."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "See repository LICENSE" }

# Runtime dependencies only. Dev tooling (pytest, ruff, mypy, ...) lives in the
# `dev` optional-dependencies group configured in Sprint 1, Step 4.
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "gym-companion-backend"
version = "0.1.0"
description = "Gym Companion backend: FastAPI API layer over a framework-free domain core."
requires-python = ">=3.10"  # 3.10 is what this environment verifies against; bump freely on a real dev machine
readme = "README.md"
license = { text = "See repository LICENSE" }

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
# Everything a developer needs beyond runtime deps: testing, linting,
# formatting, and the pre-commit framework wiring them together.
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",          # required by fastapi.testclient.TestClient
    "ruff>=0.7",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# EXE002 (executable file without a shebang) is disabled repository-wide: the
# development mount this project was scaffolded on reports every file as
# executable regardless of chmod — a filesystem artifact, not a code issue.
# The full rule selection is curated in Sprint 1, Step 6; this entry exists
# now only so Step 4's tooling runs clean.
ignore = ["EXE002"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# --strict-markers: a typo'd @pytest.mark.unti is a collection error, not a
# silently-ignored no-op marker.
# --strict-config: an unrecognised ini option fails the run instead of being
# silently ignored — the whole point of pinning config is that it's obeyed.
addopts = "-ra --strict-markers --strict-config --cov=app --cov-report=term-missing"
markers = [
    "unit: fast, isolated tests with no I/O — primarily app/domain.",
    "integration: tests that exercise a real database or other external system.",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# No repo-wide fail_under yet — most of the repo is thin wiring (app/main.py,
# app/core/config.py) that integration/E2E tests exercise better than unit
# coverage numbers reward. Sprint 1, Step 12 adds a real, high floor scoped
# specifically to app/domain, per the Engineering Master Plan's instruction
# that Domain Core coverage is merge-blocking and everything else scales to
# its own risk tier — a single blanket number today would be theater, not a
# quality gate.

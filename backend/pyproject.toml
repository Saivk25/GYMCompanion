[project]
name = "gym-companion-backend"
version = "0.1.0"
description = "Gym Companion backend: FastAPI API layer over a framework-free domain core."
requires-python = ">=3.10"  # 3.10 is what this environment verifies against; bump freely on a real dev machine
readme = "README.md"
license = { text = "See repository LICENSE" }

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# A curated selection, not "ALL" — enabling every rule category is its own
# form of over-engineering for a solo developer (constant noqa management
# with no proportional safety benefit). Each group earns its place:
select = [
    "E", "F",   # pycodestyle errors + pyflakes: correctness basics.
    "I",        # isort: one deterministic import order, no bikeshedding.
    "UP",       # pyupgrade: keep syntax current for the pinned Python floor.
    "B",        # flake8-bugbear: catches real bug patterns (mutable defaults, etc).
    "C4",       # flake8-comprehensions: unnecessary list()/dict() wrapping.
    "SIM",      # flake8-simplify: de-nest and de-duplicate obvious cases.
    "N",        # pep8-naming: consistent naming across a codebase one person writes alone.
    "ASYNC",    # flake8-async: real footguns in an async framework (blocking calls, etc).
    "S",        # flake8-bandit: basic security checks — worth it given this app handles health data.
    "RUF",      # ruff-specific checks not covered above.
]
ignore = [
    # Filesystem artifact of this development environment (see Step 4) — every
    # file here reports as executable regardless of chmod.
    "EXE002",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert (S101-style) and long, repetitive fixtures —
# neither is a code smell in test code the way it would be in app/.
"tests/**" = [
    "S101",         # assert is the point of a test, not a smell.
    "S105", "S106", # tests deliberately use fake secrets to exercise the guard in app/core/config.py.
]

# No [tool.ruff.format] overrides: the default (double quotes, matching
# every docstring's """) is what the whole codebase already uses. An
# earlier version of this file set quote-style = "single" without a real
# reason and every existing file failed `ruff format --check` as a
# result — reverted rather than reformatting correct code to fit an
# arbitrary preference.

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
# The codebase is small enough today that starting at `strict` costs nothing
# and is far cheaper than retrofitting strictness onto a larger one later —
# consistent with the Engineering Master Plan's "near-100% coverage is cheap
# now" reasoning applied to types instead of tests.

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=app --cov-report=term-missing"
markers = [
    "unit: fast, isolated tests with no I/O — primarily app/domain.",
    "integration: tests that exercise a real database or other external system.",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# No repo-wide fail_under: app/infra and app/api are expected to carry
# untested scaffolding for a while yet (e.g. FastAPI's own get_session()
# dependency-injection wiring, exercised only once real endpoints use it —
# see app/infra/database.py's Missing column). A single blanket number
# would either be too strict for those or too loose to mean anything for
# app/domain, which is why app/domain gets its own, separate, 100% gate
# instead — see the Makefile's backend-test-domain-coverage target and
# `[tool.coverage.report:domain]`-equivalent invocation via --cov-fail-under
# on the command line (coverage.py has no way to scope fail_under to a
# subpackage from this config file alone). Matches the Engineering Master
# Plan's testing strategy table: "Domain Core ... near-100% coverage ...
# merge-blocking."
